name: Catalog Claim Liveness (T-0574)

# WHY THIS IS ITS OWN REPO-ROOT WORKFLOW — agents/process/enforcement.md §"The catalog-claim
# liveness check", the ADR-0032 §D / ADR-0037 D7 cross-stack shape.
#
# NO STACK'S CI WATCHES `agents/`:
#   * backend-ci.yml   triggers on the .NET subtrees and explicitly EXCLUDES both mobile trees.
#   * frontend-ci.yml  is paths-scoped to 'src/Cleansia.App/**' and runs `nx affected`, which selects
#                      ZERO projects for a markdown-only diff — and Nx inputs cannot reference paths
#                      above the workspace root, so a spec there would replay a cached green.
#   * ios-ci / android-ci are Xcode and Gradle. They cannot read Markdown claims about C#.
# So no existing workflow can host this, and widening one would spin a full app build on every
# catalog edit. Hence a separate, tiny workflow whose only job is this comparison.
#
# THE TRIGGER LIST IS THE CHECK, NOT A NICETY. A citation rots when the CITED file changes, not when
# the citing page does — every one of the six instances measured on 2026-08-09 was written correctly
# and falsified by an edit somewhere else. A workflow triggered only on 'agents/**' would have missed
# all of them. Measured at the commit that introduced this tool, the corpus's resolvable citations
# land: 328 in src/, 12 in .github/, 9 in agents/. If a new tree starts being cited, add it here —
# the checker indexes docs/, scripts/, deploy/ and sql-scripts/ too, so a citation into one of those
# still RESOLVES; it just would not be re-checked until the next agents/ or src/ change.

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'agents/**'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/catalog-claims.yml'
  push:
    branches:
      - master
    paths:
      - 'agents/**'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/catalog-claims.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No npm install: the checker and its self-test are dependency-free and use only node: builtins.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BLOCKING, and it runs FIRST. The guard's own acceptance test: it builds throwaway mini-repos,
      # mutates one banner / one citation / one ADR status line and asserts red, and asserts that a
      # blind run (empty corpus, broken parser, under-populated tree) is red rather than clean. Stub
      # the checker to exit 0 and this step goes red, so the gate cannot rot into scaffolding.
      # Its own baseline IS zero by construction, which is why it blocks while the sweep below
      # does not.
      - name: Catalog-claim guard self-test
        run: node agents/tools/check-catalog-claims.test.mjs

      # BLOCKING — `T1-CI` since the sweep that closed the baseline. It shipped ADVISORY on purpose:
      # enforcement.md's zero-baseline rule ("add enforcement behind the cleanup, never in front of
      # it") forbids a blocking tier over a dirty baseline, and the baseline was 16 (C1 1 · C2 7 ·
      # C3 8) at the commit that introduced this tool. The tool's own stated promotion condition —
      # a whole-corpus run reporting `FAILED: C1 0 · C2 0 · C3 0` — was met, so `--warn` came off in
      # the same change that closed the last violation. Do NOT re-add it to get a red build green:
      # that reinstates the exact debt this tool was built to retire, and the flag's absence is the
      # only record that the corpus was ever clean.
      #
      # WHAT STAYS ADVISORY, and must not be promoted with it: C3B — "is the cited SUBJECT still on
      # the cited lines" — reports 147 misses and fails nothing. It cannot decide that the lines say
      # what the entry claims; that stays the reader's. Wiring C3B into the exit code would put a
      # heuristic in the blocking path and teach everyone to route around the gate.
      - name: Catalog claim liveness (ADR status · retirement banners · citations)
        run: node agents/tools/check-catalog-claims.mjs
