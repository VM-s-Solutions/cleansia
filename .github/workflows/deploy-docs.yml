name: Deploy Docs

# DEACTIVATED (owner request 2026-07-15): the automatic push trigger is disabled so docs
# changes no longer spin a deploy. Left runnable on demand via the Actions tab. To re-enable
# automatic deploys, restore the `push:` trigger (branches: master, paths: docs/**).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    name: Build and Deploy Docs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: cd docs && npm ci

      - name: Build VitePress site
        run: cd docs && npm run build

      # DEV ONLY, and there is no prod counterpart by construction: main.bicep declares the docs
      # Static Web App under `if (env == 'dev')`, so no prod resource exists to deploy to and no
      # prod token exists to hold. The site is also gated — docs/public/staticwebapp.config.json
      # requires the `docs_reader` role on every route, so a fresh deploy is reachable only by
      # people invited through the SWA's Role management blade.
      #
      # If the token below ever starts failing with 401, the SWA was most likely re-created by an
      # infrastructure deploy: the deployment token is per-resource, so it has to be re-copied.
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DOCS_DEV }}
          action: upload
          app_location: docs/.vitepress/dist
          skip_app_build: true
          skip_api_build: true
