name: Deploy to PRO

# THIN caller for the shared pipeline (deploy-azure.yml) — the SAME build/provision/migrate/deploy
# flow as dev, pointed at the prod footprint. This file owns only what is prod-specific:
#
# - Dispatch-ONLY (never a push trigger): prod deploys are always a deliberate button press, and the
#   mode defaults to `what-if` so the no-thought path is the non-mutating preview; a real `deploy`
#   is an explicit choice.
# - The old typed-"deploy"-confirmation gate is REPLACED by GitHub Environment protection: every job
#   that touches prod runs in the `prod-weu` Environment (set inside the reusable workflow), whose
#   REQUIRED REVIEWERS must approve the run before any prod secret is released. That protection is
#   UI config, not YAML — see the PROD section of deploy/AZURE-DEV-RUNBOOK.md for the setup steps.
# - Concurrency stays caller-level: one prod run at a time, and an in-flight prod deploy is never
#   cancelled by a newer one.
# - `secrets: inherit` + the reusable jobs' `environment: prod-weu` resolve every secret by NAME from
#   the prod-weu GitHub Environment (same secret NAMES as dev-weu, prod values); no secret value is
#   in this file (ADR-0015 D4).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = provision + migrate + deploy all hosts; what-if = non-mutating Bicep preview only'
        type: choice
        required: true
        default: what-if
        options:
          - deploy
          - what-if
      forceProvision:
        description: 'Re-run Bicep even if deploy/bicep is unchanged (normally skipped — on prod that first restart hits the LIVE site, which the slot-swap posture exists to avoid)'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pro
  cancel-in-progress: false

jobs:
  # Production never launches on unreviewed legal texts: every host start seeds the texts in the repo,
  # so a draft in force here would be what customers accept, and a future-dated draft would come into
  # force on its date with no deploy in between. Runs in both modes, before any provisioning.
  legal-texts:
    name: No legal text in force or upcoming is a draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test the legal draft gate
        run: node agents/tools/check-legal-drafts.test.mjs

      - name: Every legal text in force or upcoming is reviewed
        run: node agents/tools/check-legal-drafts.mjs

  deploy:
    name: Prod pipeline
    needs: legal-texts
    uses: ./.github/workflows/deploy-azure.yml
    permissions:
      id-token: write
      contents: read
    with:
      env: prod
      githubEnvironment: prod-weu
      mode: ${{ inputs.mode }}
      region: weu
      bicepparamFile: deploy/bicep/weu.prod.bicepparam
      forceProvision: ${{ inputs.forceProvision }}
    secrets: inherit
