name: Execute SQL Script

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - DEV
          - PRO
      script_path:
        description: 'SQL script filename from sql-scripts/ folder (e.g., check-db-health.sql)'
        required: true
        type: string
      confirm:
        description: 'Type "execute" to confirm (required for PRO). On DEV, a script that asks for it reads this as cleansia.confirm'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-26.04
    steps:
      - name: Check PRO confirmation
        if: inputs.environment == 'PRO' && inputs.confirm != 'execute'
        run: |
          echo "::error::You must type 'execute' to confirm production SQL execution"
          exit 1

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # insert_seed_data.sql is a DEVELOPMENT FIXTURE, not an operational script. It creates the
      # catalogue a fresh dev database needs; running it against production would collide with real
      # catalogue rows.
      #
      # The app itself cannot do this: CleansiaStartupBase reads the file only inside
      # `if (environment.IsDevelopment())`, and deployed hosts apply the EF migration bundle from CI
      # without ever calling the seeder. This workflow was the one remaining path to production, and
      # a human typing "execute" was the only thing in the way.
      #
      # The path is resolved inside sql-scripts/ and lower-cased before it is compared, so ./seed/x.sql,
      # a/../insert_seed_data.sql and Insert_Seed_Data.sql are the fixtures they name, and a path that
      # resolves outside sql-scripts/ is refused with them.
      - name: Refuse development fixtures against production
        if: inputs.environment == 'PRO'
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          RESOLVED=$(realpath -m --relative-to="$PWD/sql-scripts" "$PWD/sql-scripts/$SCRIPT_PATH" | tr '[:upper:]' '[:lower:]')
          case "$RESOLVED" in
            insert_seed_data.sql|seed|seed/*|..|../*|/*)
              echo "::error::$SCRIPT_PATH is a development fixture, or lies outside sql-scripts/, and must never run against PRO."
              echo "::error::It seeds the development catalogue (see README.md)."
              exit 1
              ;;
          esac
          echo "Not a development fixture — continuing."

      # DEV-only scripts, one row each: file name | what it does | where production does it instead.
      # - insert_local_dev_admin.sql mints an administrator whose password is in README.md. Owner ruling
      #   2026-09-30: DEV may hold it until an app registration gates the DEV apps; PRO never does.
      # - The fix-*.sql rows correct what a DEV database got from a development fixture (README.md in
      #   sql-scripts/). Production is never built from those fixtures, so they have nothing to correct
      #   there; they are refused all the same, so that nobody has to know that to be safe.
      # Compared by basename so a path like seed/../ cannot walk around a row. A new DEV-only script is
      # one more row.
      - name: Refuse DEV-only scripts against production
        if: inputs.environment == 'PRO'
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          NAME=$(basename "$SCRIPT_PATH")
          while IFS='|' read -r DEV_ONLY WHAT INSTEAD; do
            if [ "$NAME" = "$DEV_ONLY" ]; then
              echo "::error::$DEV_ONLY $WHAT, and never runs against PRO."
              echo "::error::$INSTEAD"
              exit 1
            fi
          done <<'DEV_ONLY_SCRIPTS'
          insert_local_dev_admin.sql|creates an administrator whose password is published in README.md (DEV may run it: owner ruling 2026-09-30)|Create a named administrator with set-admin-role.sql instead (see README.md).
          fix-company-contact-placeholders.sql|rewrites the seeded DEV company record's e-mail and phone|Production's company e-mail and phone are entered in the admin console (see README.md).
          fix-plus-trial-14-days.sql|gives the two seeded DEV Cleansia Plus plans their 14-day trial back|Production's plans and their trials are entered in the admin console.
          fix-deactivate-local-dev-admin.sql|retires the published-password administrator from the shared DEV database|Production never holds that administrator: insert_local_dev_admin.sql is refused there.
          fix-service-city-zip-prefixes.sql|moves the seeded DEV service cities to the ZIP prefixes the booking gate enforces|Production is seeded with those prefixes by prod-bootstrap.sql, and its cities are kept in the admin console.
          dev-e2e-confirm-accounts.sql|confirms the e-mail of the e2e test accounts|Production has no test accounts.
          dev-e2e-publish-cleaner-document.sql|publishes a new version of the cleaner documents for an E2E run, which every cleaner must accept again|Production's legal texts are seeded from the repository's embedded markdown at host start.
          dev-e2e-read-fee-receipts.sql|reads the fee receipts of the e2e test orders|Production has no test orders.
          dev-e2e-read-saved-cards.sql|reads the saved cards, card orders and Stripe events of the e2e test customers|Production has no test customers.
          DEV_ONLY_SCRIPTS
          echo "Not a DEV-only script — continuing."

      - name: Verify script exists
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi
          echo "Script found: $SCRIPT"
          echo "--- Script contents ---"
          cat "$SCRIPT"

  execute-dev:
    name: Execute on DEV
    if: inputs.environment == 'DEV'
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    # The environment releases its stage-scoped database secret under its protection rules.
    environment: dev-weu
    env:
      FIREWALL_RULE_URL: https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-cleansia-weu-dev/providers/Microsoft.DBforPostgreSQL/flexibleServers/pg-cleansia-weu-dev/firewallRules/ci-sql-${{ github.run_id }}-${{ github.run_attempt }}?api-version=2024-08-01
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # DEV Postgres admits Azure source IPs and the admin IP only, and some GitHub-hosted runners run
      # outside Azure, where the server drops the connection unanswered. The same per-run rule as
      # deploy-azure.yml's migration. Creating a rule is asynchronous, so the step waits until it exists.
      - name: Open the DEV database firewall to this runner
        run: |
          RUNNER_IP="$(curl -s --max-time 10 https://api.ipify.org)"
          if ! [[ "$RUNNER_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::could not resolve the runner's public IPv4 (got '$RUNNER_IP')"; exit 1
          fi
          for attempt in $(seq 1 18); do
            if az rest --method get --url "$FIREWALL_RULE_URL" --output none 2>/dev/null; then
              echo "Firewall rule open for $RUNNER_IP"; exit 0
            fi
            az rest --method put --url "$FIREWALL_RULE_URL" --output none \
              --body "{\"properties\":{\"startIpAddress\":\"${RUNNER_IP}\",\"endIpAddress\":\"${RUNNER_IP}\"}}" || true
            sleep 10
          done
          echo "::error::the firewall rule for $RUNNER_IP did not appear within 3 minutes"
          exit 1

      - name: Execute SQL script
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_DEV }}
          PGCONNECT_TIMEOUT: '15'
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          SCRIPT_PATH: ${{ inputs.script_path }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"
          test -r "$PGSSLROOTCERT" || { echo "::error::Trusted root certificate file is unavailable"; exit 1; }

          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::DB_CONNECTION_STRING_DEV secret is not set"
            exit 1
          fi

          # The confirmation reaches the script as the session setting cleansia.confirm, so a script that changes
          # every DEV user of a kind (dev-e2e-publish-cleaner-document.sql) publishes only when the dispatch names it.
          # It is quoted into SQL below, so it may hold only the characters of a file name.
          case "$CONFIRM" in
            *[!A-Za-z0-9._-]*)
              echo "::error::confirm may hold only letters, digits, '.', '_' and '-'"
              exit 1
              ;;
          esac

          # Parse connection string components
          DB_HOST=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Host=\K[^;]+')
          DB_PORT=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Port=\K[^;]+' || echo "5432")
          DB_NAME=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Database=\K[^;]+')
          DB_USER=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Username=\K[^;]+')
          DB_PASS=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Password=\K[^;]+')

          echo "Executing script: $SCRIPT"
          echo "Target: $DB_HOST:$DB_PORT/$DB_NAME"
          echo "Environment: DEV"
          echo "---"

          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --set ON_ERROR_STOP=1 \
            -c "SET cleansia.confirm = '$CONFIRM'" \
            -f "$SCRIPT"

          echo "---"
          echo "Script executed successfully."

      # Runs on failure and cancellation too. A delete refused while the server is busy is retried.
      - name: Remove the runner firewall rule
        if: always()
        run: |
          for attempt in 1 2 3 4 5 6; do
            if az rest --method delete --url "$FIREWALL_RULE_URL" --output none; then exit 0; fi
            sleep 10
          done
          echo "::warning::could not remove firewall rule ci-sql-${{ github.run_id }}-${{ github.run_attempt }} from pg-cleansia-weu-dev; delete it by hand"

  execute-pro:
    name: Execute on PRO
    if: inputs.environment == 'PRO'
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: prod-weu
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL script
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_PRO }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"
          test -r "$PGSSLROOTCERT" || { echo "::error::Trusted root certificate file is unavailable"; exit 1; }

          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::DB_CONNECTION_STRING_PRO secret is not set"
            exit 1
          fi

          # Parse connection string components
          DB_HOST=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Host=\K[^;]+')
          DB_PORT=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Port=\K[^;]+' || echo "5432")
          DB_NAME=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Database=\K[^;]+')
          DB_USER=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Username=\K[^;]+')
          DB_PASS=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Password=\K[^;]+')

          echo "Executing script: $SCRIPT"
          echo "Target: $DB_HOST:$DB_PORT/$DB_NAME"
          echo "Environment: PRO"
          echo "---"

          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --set ON_ERROR_STOP=1 \
            -f "$SCRIPT"

          echo "---"
          echo "Script executed successfully."
