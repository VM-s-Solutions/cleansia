name: Execute SQL Script

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - DEV
          - PRO
      script_path:
        description: 'SQL script filename from sql-scripts/ folder (e.g., check-db-health.sql)'
        required: true
        type: string
      confirm:
        description: 'Type "execute" to confirm (required for PRO)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check PRO confirmation
        if: inputs.environment == 'PRO' && inputs.confirm != 'execute'
        run: |
          echo "::error::You must type 'execute' to confirm production SQL execution"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      # insert_seed_data.sql is a DEVELOPMENT FIXTURE, not an operational script. It creates the
      # catalogue a fresh dev database needs; running it against production would collide with real
      # catalogue rows.
      #
      # The app itself cannot do this: CleansiaStartupBase reads the file only inside
      # `if (environment.IsDevelopment())`, and deployed hosts apply the EF migration bundle from CI
      # without ever calling the seeder. This workflow was the one remaining path to production, and
      # a human typing "execute" was the only thing in the way.
      #
      # The path is resolved inside sql-scripts/ and lower-cased before it is compared, so ./seed/x.sql,
      # a/../insert_seed_data.sql and Insert_Seed_Data.sql are the fixtures they name, and a path that
      # resolves outside sql-scripts/ is refused with them.
      - name: Refuse development fixtures against production
        if: inputs.environment == 'PRO'
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          RESOLVED=$(realpath -m --relative-to="$PWD/sql-scripts" "$PWD/sql-scripts/$SCRIPT_PATH" | tr '[:upper:]' '[:lower:]')
          case "$RESOLVED" in
            insert_seed_data.sql|seed|seed/*|..|../*|/*)
              echo "::error::$SCRIPT_PATH is a development fixture, or lies outside sql-scripts/, and must never run against PRO."
              echo "::error::It seeds the development catalogue (see README.md)."
              exit 1
              ;;
          esac
          echo "Not a development fixture — continuing."

      # insert_local_dev_admin.sql mints an administrator whose password is in README.md. Owner ruling
      # 2026-09-30: DEV may hold it until an app registration gates the DEV apps; PRO never does.
      # Compared by basename so a path like seed/../ cannot walk around it.
      - name: Refuse the local administrator fixture against production
        if: inputs.environment == 'PRO'
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          if [ "$(basename "$SCRIPT_PATH")" = "insert_local_dev_admin.sql" ]; then
            echo "::error::insert_local_dev_admin.sql creates an administrator whose password is published in README.md, and never runs against PRO (DEV may run it: owner ruling 2026-09-30)."
            echo "::error::Create a named administrator with set-admin-role.sql instead (see README.md)."
            exit 1
          fi

      # fix-company-contact-placeholders.sql moves a DEV database's seeded company record to the owner's
      # 2026-10-03 contact values. Production's company record is typed into the admin console, so the
      # script has nothing to do there and never runs there. Compared by basename, as above.
      - name: Refuse the DEV company-contact fix against production
        if: inputs.environment == 'PRO'
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          if [ "$(basename "$SCRIPT_PATH")" = "fix-company-contact-placeholders.sql" ]; then
            echo "::error::fix-company-contact-placeholders.sql rewrites the seeded DEV company record's e-mail and phone, and never runs against PRO."
            echo "::error::Production's company e-mail and phone are entered in the admin console (see README.md)."
            exit 1
          fi

      - name: Verify script exists
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi
          echo "Script found: $SCRIPT"
          echo "--- Script contents ---"
          cat "$SCRIPT"

  execute-dev:
    name: Execute on DEV
    if: inputs.environment == 'DEV'
    needs: validate
    runs-on: ubuntu-latest
    # Match deploy-dev.yml (environment: dev-weu) so OIDC federates with the
    # environment:dev-weu subject that holds the RBAC + the dev-scoped secrets
    # (AZURE_* + DB_CONNECTION_STRING_DEV). Without it the branch subject has no
    # subscription access → "No subscriptions found". (execute-pro uses prod-weu.)
    environment: dev-weu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL script
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_DEV }}
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"

          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::DB_CONNECTION_STRING_DEV secret is not set"
            exit 1
          fi

          # Parse connection string components
          DB_HOST=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Host=\K[^;]+')
          DB_PORT=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Port=\K[^;]+' || echo "5432")
          DB_NAME=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Database=\K[^;]+')
          DB_USER=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Username=\K[^;]+')
          DB_PASS=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Password=\K[^;]+')

          echo "Executing script: $SCRIPT"
          echo "Target: $DB_HOST:$DB_PORT/$DB_NAME"
          echo "Environment: DEV"
          echo "---"

          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --set ON_ERROR_STOP=1 \
            --set sslmode=require \
            -f "$SCRIPT"

          echo "---"
          echo "Script executed successfully."

  execute-pro:
    name: Execute on PRO
    if: inputs.environment == 'PRO'
    needs: validate
    runs-on: ubuntu-latest
    environment: prod-weu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL script
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_PRO }}
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          SCRIPT="sql-scripts/$SCRIPT_PATH"

          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::DB_CONNECTION_STRING_PRO secret is not set"
            exit 1
          fi

          # Parse connection string components
          DB_HOST=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Host=\K[^;]+')
          DB_PORT=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Port=\K[^;]+' || echo "5432")
          DB_NAME=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Database=\K[^;]+')
          DB_USER=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Username=\K[^;]+')
          DB_PASS=$(echo "$DB_CONNECTION_STRING" | grep -oP 'Password=\K[^;]+')

          echo "Executing script: $SCRIPT"
          echo "Target: $DB_HOST:$DB_PORT/$DB_NAME"
          echo "Environment: PRO"
          echo "---"

          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --set ON_ERROR_STOP=1 \
            --set sslmode=require \
            -f "$SCRIPT"

          echo "---"
          echo "Script executed successfully."
