name: Frontend CI

# Also runs on pushes to master, for the same reason backend-ci does: a pull_request-only
# trigger means a direct-to-master commit is never built, so an NSwag regen that breaks an
# untouched consumer lands unnoticed and reddens the next contributor's PR instead. The push
# trigger is paths-scoped to the frontend tree and skips the e2e job (a merged PR already ran
# it); the concurrency group keeps stacked pushes from burning minutes on stale SHAs.
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master
    paths:
      - 'src/Cleansia.App/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Nx 'affected' needs the merge-base with the target branch, so fetch history.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./src/Cleansia.App/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/Cleansia.App

      # Derive the Nx affected base (the PR target branch) so lint/test only run on
      # projects the change actually touches — fast, and still a real gate.
      #
      # A push has no base_ref. `github.event.before` is the canonical push base and is
      # the one that covers EVERY commit in the push — `HEAD~1` sees only the last, so a
      # multi-commit or rebase push would under-run the affected tests. It is preferred
      # for exactly that reason, but it is not always reachable (a force-push can drop it;
      # it is all-zeros on branch creation), and an unresolvable --base makes the affected
      # steps ERROR — which would fail this job BEFORE the three production builds, i.e.
      # take out the drift gate this trigger exists to carry. So: use `before` when it
      # resolves, fall back to `HEAD~1` when it does not. Either way the blast radius is
      # bounded — the three builds below are unconditional and never affected-gated.
      - name: Set Nx base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "NX_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi

      # Lint is INFORMATIONAL for now (continue-on-error): the lint baseline has
      # pre-existing debt in several libs (module-boundary, a11y, unused-var), so making
      # it blocking today would red every PR on debt the change didn't introduce. It still
      # runs so regressions are visible in the PR. Flip to blocking once the baseline is
      # clean (tracked as a follow-up lint-cleanup ticket).
      - name: Lint (affected, non-blocking)
        continue-on-error: true
        run: npx nx affected -t lint --base="$NX_BASE" --head=HEAD --parallel=3
        working-directory: ./src/Cleansia.App

      # The regen-drift guard's own suite. It runs here so the guard cannot rot into
      # scaffolding: stub tools/typecheck-apps.mjs to exit 0 and this step goes red.
      - name: Regen-drift guard self-test
        run: npm run typecheck:test
        working-directory: ./src/Cleansia.App

      # Jest unit tests — the suites (facades, components, parity guards, a11y) that
      # CI was not running before. Affected-only keeps it quick.
      - name: Unit tests (affected)
        run: npx nx affected -t test --base="$NX_BASE" --head=HEAD --parallel=3 --ci
        working-directory: ./src/Cleansia.App

      # Production builds of all 3 apps stay an explicit gate (they catch generated-client
      # / template / SSR breakage that unit tests miss — e.g. the NSwag regen drift).
      - name: Build Customer App
        run: npm run build:cleansia-customer
        working-directory: ./src/Cleansia.App

      - name: Build Partner App
        run: npm run build:cleansia-partner
        working-directory: ./src/Cleansia.App

      - name: Build Admin App
        run: npm run build:cleansia-admin
        working-directory: ./src/Cleansia.App

  # ── Phase-0 E2E smokes (T-0271 customer + T-0281 partner & admin) ──
  # Runs the three Playwright critical-path smokes through the REAL UIs:
  #   - customer: booking wizard → Stripe checkout handoff       (apps/cleansia.app-e2e)
  #   - partner:  login → accept job → Available→My transition    (apps/cleansia-partner.app-e2e)
  #   - admin:    login → employee-management seeded data row     (apps/cleansia-admin.app-e2e)
  # Backend seam for ALL THREE: Playwright network-stubbing (no live API / Postgres)
  # — documented in each spec header. This is its OWN job (NOT Nx-affected gated) so
  # a change anywhere that breaks a critical path can't silently skip it.
  #
  # The three smokes run as SEQUENTIAL steps, not in parallel: each app's Playwright
  # `webServer` boots `nx run <app>:serve` on the same :4200, so they cannot share a
  # job concurrently — each step boots and tears down its own app server in turn.
  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./src/Cleansia.App/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/Cleansia.App

      # A single browser is enough for a smoke; every e2e config is chromium-only.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./src/Cleansia.App

      # The plain `e2e` target runs `playwright test` directly — its webServer boots
      # `nx run <app>:serve` and waits (up to the config's 300s) for the dev server
      # before the spec runs. (NOT `e2e-ci`: that atomizes the spec set into per-file
      # tasks that REQUIRE Nx Cloud Agents to distribute — without Nx Agents it errors
      # "should only be run with Nx Agents". The smoke is one spec per app, so the plain
      # `e2e` target is the correct, agent-free entry.)
      - name: Run customer booking smoke
        run: npx nx run cleansia.app-e2e:e2e
        working-directory: ./src/Cleansia.App

      - name: Run partner accept-job smoke
        run: npx nx run cleansia-partner.app-e2e:e2e
        working-directory: ./src/Cleansia.App

      - name: Run admin seeded-row smoke
        run: npx nx run cleansia-admin.app-e2e:e2e
        working-directory: ./src/Cleansia.App

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./src/Cleansia.App/dist/.playwright/apps/*-e2e/playwright-report
          retention-days: 7
