name: Module Boundaries (T-0534)

# WHY THIS IS ITS OWN WORKFLOW, and not a step in frontend-ci.
#
# `@nx/enforce-module-boundaries` has been configured for a while and every lib is tagged. Neither
# fact was ever a GATE:
#
#   * frontend-ci.yml's only lint step is `continue-on-error: true` (:73). A boundary violation
#     reported there sets no exit code — which is exactly how a customer lib importing the PARTNER
#     generated client (T-0533) shipped and stayed shipped.
#   * that step is also `nx affected -t lint`, so it cannot select a project the change did not
#     touch. A boundary violation is a statement about a PAIR of projects; the half that reports it
#     is not always the half that was edited.
#   * and until T-0534 the constraint table every project spread was
#     `sourceTag:'*' -> onlyDependOnLibsWithTags:['*']`, i.e. allow everything, so the rule was off
#     for the 50 projects with a local eslint.config.mjs and on only for the handful without one.
#
# The gate therefore lints from the WORKSPACE ROOT with the root config, not through the per-project
# configs — a per-project config cannot opt out of a check that never reads it. Verified equal to
# `nx run-many -t lint --all --skip-nx-cache` at the commit that introduced it: same 19 violations,
# same 19 files.
#
# It is an EXACT-MATCH ratchet in both directions, because `agents/process/enforcement.md` puts
# enforcement behind a cleanup and never in front of one: the three pre-existing rule classes that
# survive (buildable-lib, static-import-of-lazy, one deep relative import) are recorded so they
# cannot grow, and closing one requires deleting its entry in the same change.

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'src/Cleansia.App/**'
      - 'agents/tools/check-module-boundaries.mjs'
      - 'agents/tools/check-module-boundaries.test.mjs'
      - '.github/workflows/module-boundaries.yml'
  push:
    branches:
      - master
    paths:
      - 'src/Cleansia.App/**'
      - 'agents/tools/check-module-boundaries.mjs'
      - 'agents/tools/check-module-boundaries.test.mjs'
      - '.github/workflows/module-boundaries.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./src/Cleansia.App/package-lock.json

      # Runs FIRST, and needs no workspace: it feeds synthetic `eslint -f json` reports through the
      # tool's --report seam. Stub the tool's body to `process.exit(0)` and all 21 scenarios go red,
      # so the gate cannot decay into scaffolding.
      - name: Module-boundary gate self-test
        run: node agents/tools/check-module-boundaries.test.mjs

      # The gate itself needs eslint + @nx/eslint-plugin + the project graph, so it installs.
      - name: Install dependencies
        run: npm ci
        working-directory: ./src/Cleansia.App

      # Blocking by construction: no continue-on-error, and an empty or partial scan is a failure
      # rather than a pass.
      - name: Module boundaries (zero cross-scope, zero cycles, zero untagged)
        run: node agents/tools/check-module-boundaries.mjs
