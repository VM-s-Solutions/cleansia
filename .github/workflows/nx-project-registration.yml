name: Nx Project Registration (T-0537)

# WHY THIS IS ITS OWN WORKFLOW, and not a step in frontend-ci.
#
# The state this guards is a library that Nx does not know exists — no project.json, therefore no
# test target, no lint target and no module-boundary constraint, all three silent at once. That is
# how libs/cleansia-partner-features/dashboard shipped unregistered for months. NX-6/NX-7 (T-0546)
# extend it one layer in: a lib that IS registered and tagged, but whose tsconfig `extends` dangles
# or whose jest config has no `test` target, has a green test target that has never compiled a test.
# Jest prints "No tests found, exiting with code 0" and Nx prints "Successfully ran target test".
# NX-8 (T-0463) closes the layer under that: a project with NEITHER a jest config NOR a `test`
# target is invisible to NX-7, whose witness IS the jest config. All three libs/data-access/*-stores
# — the NgRx effects for auth, user and the catalog — sat there with `lint` as their only target.
#
#   * frontend-ci.yml's LINT step is `continue-on-error: true` (:73). Anything attached there reports
#     success no matter what it found, so it could never fail this build.
#   * frontend-ci.yml's TEST step is `nx affected -t test`. An unregistered lib belongs to no
#     project, so `affected` can never select it — the guard would be excluded from CI by exactly the
#     defect it exists to catch. Hosting the spec inside some other project does not rescue it
#     either: nx.json gives @nx/jest:jest inputs `{projectRoot}/**/*` with an EMPTY sharedGlobals, so
#     adding an unregistered directory elsewhere in the tree does not invalidate that project's cache
#     and Nx replays a CACHED PASS over the hole.
#   * agents/tools/check-consistency.mjs is the counter-example, not the model: it appears in ZERO
#     workflow files (ADR-0038 CH-P6) and can therefore never set an exit code at all.
#
# Hence a separate, tiny, repo-root workflow with no continue-on-error, whose only job is the
# enumeration. The checker is dependency-free Node living OUTSIDE the Nx workspace, so it is
# uncacheable by construction rather than by configuration.

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'src/Cleansia.App/**'
      - 'agents/tools/check-nx-project-registration.mjs'
      - 'agents/tools/check-nx-project-registration.test.mjs'
      - '.github/workflows/nx-project-registration.yml'
  push:
    branches:
      - master
    paths:
      - 'src/Cleansia.App/**'
      - 'agents/tools/check-nx-project-registration.mjs'
      - 'agents/tools/check-nx-project-registration.test.mjs'
      - '.github/workflows/nx-project-registration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No npm install: the checker and its self-test are dependency-free and use only node: builtins.
      # Installing the workspace would also be self-defeating — the point is to read the tree without
      # asking Nx, which cannot see the projects this guard looks for.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs FIRST and unconditionally. T-0537 AC1 states the acceptance test behaviourally —
      # "temporarily rename one project.json, show the failure, restore" — so the self-test performs
      # exactly that, plus AC3's empty-corpus cases, T-0546's NX-6/NX-7 cases and T-0463's NX-8
      # cases, against throwaway fixture trees. Stub the checker to exit 0 and this step goes red on
      # 41 of its 46 scenarios (the 5 survivors are the must-NOT-fire ones, which a no-op passes by
      # construction): the guard cannot rot into scaffolding.
      - name: Registration guard self-test
        run: node agents/tools/check-nx-project-registration.test.mjs

      # The gate. Blocking by construction: no continue-on-error, and an empty scan is a failure.
      - name: Nx project registration (every lib root is a tagged, runnable Nx project)
        run: node agents/tools/check-nx-project-registration.mjs
