name: Offerability Parity (ADR-0037 D7 layer 2)

# WHY THIS IS ITS OWN WORKFLOW — ADR-0037 D7 ruling 3, amended by CH-M7.
#
# The drift this guards lives across four trees at once (C# domain rule, Angular partner app,
# Kotlin partner-app, Swift CleansiaPartner), and NO existing workflow can see it:
#
#   * frontend-ci.yml  runs `nx affected -t test`. A Kotlin/Swift/C#-only diff selects ZERO Nx
#                      projects, so a spec there never runs; and `nx.json` gives @nx/jest inputs
#                      `{projectRoot}/**/*` with an EMPTY sharedGlobals, and Nx inputs cannot
#                      reference paths above the workspace root (src/Cleansia.App) — so the domain
#                      rule and both mobile literals are not declared inputs and Nx would replay a
#                      CACHED PASS over a drifted literal. Its push trigger is additionally
#                      paths-scoped to 'src/Cleansia.App/**'.
#   * backend-ci.yml   explicitly EXCLUDES 'src/cleansia_android/**' and 'src/cleansia_ios/**'.
#   * android-ci /     Gradle and Xcode. They cannot read C#.
#     ios-ci
#
# Widening frontend-ci instead would spin three Angular production builds on every Swift commit —
# a real cost, and the reason that workflow is scoped. Hence: a separate, tiny, repo-root workflow
# whose ONLY job is the cross-stack comparison, triggered on every tree the checker reads.
#
# The checker is a plain dependency-free Node script that lives OUTSIDE the Nx workspace, so it is
# uncacheable by construction rather than by configuration — a cache-key setting can be regressed by
# an unrelated nx.json edit; not being cacheable cannot.

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'src/Cleansia.Core.Domain/**'
      - 'src/Cleansia.App/**'
      - 'src/cleansia_android/**'
      - 'src/cleansia_ios/**'
      - 'agents/tools/check-available-status-parity.mjs'
      - 'agents/tools/check-available-status-parity.test.mjs'
      - '.github/workflows/offerability-parity.yml'
  push:
    branches:
      - master
    paths:
      - 'src/Cleansia.Core.Domain/**'
      - 'src/Cleansia.App/**'
      - 'src/cleansia_android/**'
      - 'src/cleansia_ios/**'
      - 'agents/tools/check-available-status-parity.mjs'
      - 'agents/tools/check-available-status-parity.test.mjs'
      - '.github/workflows/offerability-parity.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No npm install: the checker and its self-test are dependency-free and use only node: builtins.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs FIRST and unconditionally. ADR-0037 D7 ruling 5 states layer 2's acceptance test
      # behaviourally — "delete one status from one client literal and it must go red" — so the
      # self-test performs exactly that against throwaway copies. Stub the checker to exit 0 and this
      # step goes red: the guard cannot rot into scaffolding.
      - name: Parity guard self-test
        run: node agents/tools/check-available-status-parity.test.mjs

      # The gate. All eight surfaces are gated strictly: the four partner-web divergences of ADR-0037
      # D4 rows 5/9/10/11 landed with T-0530 and their BASELINE entries were deleted in the same
      # change, which is the only way an exact-match entry can retire. --baseline stays on the command
      # so a future ticketed gap has the ratchet already wired; with an empty baseline it is a no-op.
      - name: Offerability parity (canonical C# vs web / Android / iOS)
        run: node agents/tools/check-available-status-parity.mjs --baseline
