name: Secret scan

# gitleaks over every commit reachable from the checked-out head, so a secret committed anywhere in a
# pull request fails it even if a later commit deletes it again: deleting a file does not un-publish
# it. The known history is baselined in .gitleaksignore and the committed test fakes are allow-listed
# in .gitleaks.toml, so only a NEW finding fails.
#
# The CLI, not gitleaks-action: the action needs a paid licence on an organisation repository. The
# binary is pinned by version and checksum.
on:
  # '**' not '*': `*` does not match a `/`, so a base branch like `fix/...` would never trigger.
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: No new secret in the history
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact keeps a found secret out of the job log. --log-opts=HEAD scans what this change would
      # merge, not every stale branch the full clone happens to carry.
      - name: Scan every commit reachable from HEAD
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="HEAD" .
