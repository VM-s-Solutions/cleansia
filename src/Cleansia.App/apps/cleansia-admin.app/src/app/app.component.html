<cleansia-dev-banner [bugReportUrl]="bugReportUrl" />
<div class="app-layout" [attr.data-sidebar-collapsed]="sidebarCollapsed()">
  @if (isLoggedIn()) {
  <cleansia-sidebar-menu
    [menuItems]="sidebarMenuItems()"
    [(mobileExpanded)]="mobileSidebarExpanded"
    (collapsedChange)="onSidebarCollapsedChange($event)"
  />
  }

  @if (isLoggedIn() && isMobile()) {
  <cleansia-mobile-toolbar (menuOpen)="openSidebar()">
    <span class="cleansia-mobile-toolbar__action" *cleansiaPermission="Policy.CanViewAdminNotifications">
      <cleansia-button
        icon="pi pi-bell"
        severity="secondary"
        [style]="'basic-button'"
        [text]="true"
        [routerLink]="notificationsRoute"
        [ariaLabel]="'sidebar.notifications' | translate"
      />
      @if (notificationBadge.badgeLabel(); as badge) {
      <span class="cleansia-mobile-toolbar__action-count">{{ badge }}</span>
      }
    </span>
  </cleansia-mobile-toolbar>
  }

  <main class="main-content" [ngClass]="{ 'main-content__margin': isLoggedIn(), 'main-content__with-toolbar': isLoggedIn() && isMobile() }">
    <router-outlet></router-outlet>
  </main>

  <p-toast></p-toast>
  <p-confirmDialog styleClass="cleansia-dialog" />

  <!-- Cookie Consent Banner -->
  <cleansia-cookie-consent
    [storageKey]="'cleansia-admin-cookie-consent'"
    [showDeclineButton]="true"
    [position]="'bottom'"
  />
</div>
