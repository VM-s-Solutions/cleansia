<!DOCTYPE html>
<html lang="en" style="color-scheme: light">
  <head>
    <script>
      // Sync color-scheme with stored theme before CSS loads,
      // so PrimeFlex light-dark() picks the correct values.
      (function() {
        var t = localStorage.getItem('cleansia-theme');
        var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.classList.add('dark-mode');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>Cleansia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Cleansia - Professional cleaning services in Prague and surroundings. Book your cleaning today!" />
    <link rel="icon" type="image/x-icon" href="assets/logos/Logo.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Nunito as a VARIABLE face (`400..800`), which is also how the partner and
      admin apps load it. The enumerated list this replaces asked for 400, 600
      and 700 only — while 50 rules in the customer design system set
      `font-weight: 800` and 13 set 500. Neither weight existed, so the browser
      faked them from 700 and 600 — and a synthetic bold is heavier and blurrier
      than the real face, which is exactly why "Forgot password?", the buttons
      and the labels all read heavier than the design. A variable axis also
      means the next weight someone reaches for is already there rather than
      silently synthesised.

      display=swap, NOT optional. `optional` gives each unicode subset about
      100ms and then abandons it for the rest of the page load — and `latin` and
      `latin-ext` are separate files racing separately. Win one and lose the
      other and the page renders ASCII in Nunito while every Czech diacritic
      falls back to the system sans: kaZdy in one face and the z-caron in
      another, which is the "some letters are bolder than others" report. swap
      always ends on the real face.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- Font Awesome removed — using PrimeIcons instead -->
    <!-- CDN stylesheets load async via the media="print" swap. No rel=preload
         here on purpose: preload forces HIGH priority, which starves the
         LCP hero image on slow connections. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css"
    /></noscript>

    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/npm/primeflex@4.0.0/primeflex.min.css"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/primeflex@4.0.0/primeflex.min.css"
    /></noscript>
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css"
    /></noscript>

    <!-- Google Sign-In loaded lazily on auth pages only via component -->
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
