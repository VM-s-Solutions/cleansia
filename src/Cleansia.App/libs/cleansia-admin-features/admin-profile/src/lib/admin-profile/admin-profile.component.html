<div class="cleansia-admin-profile cleansia-page">
  <div class="cleansia-admin-profile__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.admin_profile.title' | translate" [level]="1" />
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="cleansia-form">
      <cleansia-section
        [title]="'pages.admin_profile.change_password.title' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="
                'pages.admin_profile.change_password.current_password'
                  | translate
              "
              formControlName="currentPassword"
              dataType="password"
              autocomplete="current-password"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="
                'pages.admin_profile.change_password.new_password' | translate
              "
              formControlName="newPassword"
              dataType="password"
              autocomplete="new-password"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="
                'pages.admin_profile.change_password.confirm_password'
                  | translate
              "
              formControlName="confirmPassword"
              dataType="password"
              autocomplete="new-password"
              [required]="true"
            />
          </div>

          <p class="form-hint">
            {{ 'pages.admin_profile.change_password.password_hint' | translate }}
          </p>
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          [label]="'pages.admin_profile.change_password.submit' | translate"
          type="submit"
          icon="pi pi-lock"
          [disabled]="facade.saving()"
          [loading]="facade.saving()"
          (onClick)="onSubmit()"
        />
      </div>
    </form>
  </div>
</div>
