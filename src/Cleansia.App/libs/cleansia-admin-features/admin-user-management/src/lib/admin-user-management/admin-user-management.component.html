<div class="cleansia-admin-user-management cleansia-page">
  <div class="cleansia-admin-user-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.admin_user_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.admin_user_management.description' | translate }}
        </p>
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-filter-drawer [state]="facade.filters">
          <form [formGroup]="facade.filterForm" class="filter-form">
            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.admin_user_management.filters.search' | translate }}
              </h3>
              <cleansia-text-input
                formControlName="searchTerm"
                [label]="'pages.admin_user_management.filters.search_placeholder' | translate"
                [showErrors]="false"
              />
            </div>
          </form>
        </cleansia-filter-drawer>
        <cleansia-button
          *cleansiaPermission="Policy.CanCreateAdminUser"
          [label]="'pages.admin_user_management.create_user' | translate"
          icon="pi pi-plus"
          (onClick)="facade.navigateToCreateUser()"
        />
      </div>
    </div>

    <cleansia-filter-chips [state]="facade.filters" />

    <cleansia-section>
      @if (facade.initialLoading()) {
      <cleansia-loader />
      } @else {
      <cleansia-table
        [data]="facade.users()"
        [columns]="table().columns"
        [actions]="table().actions"
        [config]="{
          paginator: true,
          rows: 20,
          lazy: true,
          totalRecords: facade.totalRecords(),
          emptyMessage: 'pages.admin_user_management.no_users'
        }"
        [loading]="facade.loading()"
        (pageChange)="facade.onPageChange($event)"
        (sortChange)="facade.onSortChange($event)"
      >
      </cleansia-table>
      }
    </cleansia-section>
  </div>
</div>

<ng-template #statusTemplate let-item>
  <div class="status-cell">
    <cleansia-status-badge kind="active" [value]="item.isActive" />
  </div>
</ng-template>
