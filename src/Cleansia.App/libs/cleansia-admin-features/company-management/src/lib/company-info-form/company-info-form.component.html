<div class="cleansia-company-info-form cleansia-page">
  <div class="cleansia-company-info-form__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <div class="cleansia-detail-title">
          <cleansia-button
            [label]="'global.actions.back' | translate"
            icon="pi pi-arrow-left"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <cleansia-title [title]="pageTitle()" [level]="1" />
        </div>
      </div>
    </div>

    @if (facade.loading()) {
    <cleansia-loader />
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSave()" class="cleansia-form">
      <cleansia-section
        [title]="'pages.company_info.sections.legal_info' | translate"
      >
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.legal_name' | translate"
              formControlName="legalName"
              [required]="true"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.trading_name' | translate"
              formControlName="tradingName"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--full">
            <cleansia-textarea
              [label]="'pages.company_info.tagline' | translate"
              formControlName="tagline"
              [rows]="2"
            />
          </div>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.company_info.sections.tax_info' | translate"
      >
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="
                fieldLabels()?.registrationNumberLabel ??
                  ('pages.company_info.registration_number' | translate)
              "
              formControlName="registrationNumber"
              [required]="true"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.vat_number' | translate"
              formControlName="vatNumber"
            />
          </div>

          <div class="form-field">
            <cleansia-checkbox
              [label]="'pages.company_info.is_vat_payer' | translate"
              formControlName="isVatPayer"
            />
          </div>

          <div class="form-field">
            <cleansia-calendar
              [label]="'pages.company_info.vat_registered_from' | translate"
              formControlName="vatRegisteredFrom"
            />
          </div>

          <p class="form-hint">
            {{ 'pages.company_info.vat_registered_from_hint' | translate }}
          </p>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.company_info.sections.address' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--full">
            <cleansia-text-input
              [label]="'pages.company_info.street' | translate"
              formControlName="street"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.company_info.city' | translate"
              formControlName="city"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.company_info.zip_code' | translate"
              formControlName="zipCode"
              [required]="true"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-select
              [label]="'pages.company_info.country' | translate"
              formControlName="countryId"
              [options]="countryOptions()"
              [required]="true"
              [showClear]="false"
              [filter]="true"
              [disabled]="isEditMode"
            />
          </div>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.company_info.sections.contact' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.company_info.phone' | translate"
              formControlName="phone"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.company_info.email' | translate"
              formControlName="email"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.company_info.website' | translate"
              formControlName="website"
            />
          </div>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.company_info.sections.banking' | translate"
      >
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.bank_name' | translate"
              formControlName="bankName"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.bank_account_number' | translate"
              formControlName="bankAccountNumber"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.iban' | translate"
              formControlName="iban"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.company_info.swift' | translate"
              formControlName="swift"
            />
          </div>
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          [label]="'global.actions.cancel' | translate"
          [outlined]="true"
          (onClick)="onCancel()"
        />
        <cleansia-button
          [label]="'global.actions.save' | translate"
          type="submit"
          [disabled]="facade.saving()"
          [loading]="facade.saving()"
          (onClick)="onSave()"
        />
      </div>
    </form>
    }
  </div>
</div>
