<div class="cleansia-country-form cleansia-page">
  <div class="cleansia-country-form__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <div class="cleansia-detail-title">
          <cleansia-button
            [label]="'global.actions.back' | translate"
            icon="pi pi-arrow-left"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <cleansia-title [title]="pageTitle()" [level]="1" />
        </div>
      </div>
    </div>

    @if (facade.loading()) {
    <cleansia-loader />
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSave()" class="cleansia-form">
      <cleansia-section [title]="'pages.country_form.basic_info' | translate">
        <div class="form-grid">
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.country_form.iso_code' | translate"
              formControlName="isoCode"
              [required]="true"
              [disabled]="isEditMode()"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.country_form.iso_alpha2' | translate"
              formControlName="isoAlpha2"
              [placeholder]="'pages.country_form.iso_alpha2_placeholder' | translate"
              [required]="!isEditMode()"
            />
          </div>

          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.country_form.name' | translate"
              formControlName="name"
              [required]="true"
            />
          </div>

          <p class="form-hint">
            {{ 'pages.country_form.iso_alpha2_help' | translate }}
          </p>
        </div>
      </cleansia-section>

      <cleansia-section [title]="'pages.country_form.market' | translate">
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.country_form.insurance_coverage_amount' | translate"
              formControlName="insuranceCoverageAmount"
              dataType="number"
              [placeholder]="
                'pages.country_form.insurance_coverage_amount_placeholder' | translate
              "
              [disabled]="!marketContentEnabled()"
            />
          </div>

          <p class="form-hint">
            {{
              (marketContentEnabled()
                ? 'pages.country_form.insurance_coverage_amount_help'
                : 'pages.country_form.market_content_unavailable'
              ) | translate
            }}
          </p>
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          [label]="'global.actions.cancel' | translate"
          [outlined]="true"
          (onClick)="onCancel()"
        />
        <cleansia-button
          [label]="
            isEditMode()
              ? ('global.actions.save' | translate)
              : ('global.actions.create' | translate)
          "
          type="submit"
          [disabled]="facade.saving()"
          [loading]="facade.saving()"
          (onClick)="onSave()"
        />
      </div>
    </form>
    }
  </div>
</div>
