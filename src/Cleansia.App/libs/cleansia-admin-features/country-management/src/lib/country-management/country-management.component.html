<div class="cleansia-country-management cleansia-page">
  <div class="cleansia-country-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.country_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.country_management.description' | translate }}
        </p>
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-button
          *cleansiaPermission="Policy.CanCreateCountry"
          [label]="'pages.country_management.create_country' | translate"
          icon="pi pi-plus"
          (onClick)="createCountry()"
        />
      </div>
    </div>

    <!-- Country Table -->
    <cleansia-section>
      @if (facade.initialLoading()) {
      <cleansia-loader />
      } @else {
      <cleansia-table
        [data]="facade.countries()"
        [columns]="countryColumns"
        [actions]="countryActions"
        [config]="{
          paginator: false,
          emptyMessage: 'pages.country_management.no_countries'
        }"
        [loading]="facade.loading()"
      >
      </cleansia-table>
      }
    </cleansia-section>
  </div>
</div>

<ng-template #flagTemplate let-item>
  <span
    [ngClass]="['fi', 'fi-' + getCountryFlagCode(item.isoCode), 'flag-icon']"
  ></span>
</ng-template>
