<div class="cleansia-disputes-management cleansia-page">
  <div class="cleansia-disputes-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.disputes_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.disputes_management.description' | translate }}
        </p>
      </div>
    </div>

    <cleansia-section>
      @if (facade.initialLoading()) {
      <cleansia-loader />
      } @else if (facade.hasError()) {
      <div class="not-found-state">
        <div class="not-found-state__icon"><i class="pi pi-exclamation-triangle"></i></div>
        <p class="not-found-state__message">{{ 'pages.disputes_management.load_error' | translate }}</p>
      </div>
      } @else {
      <cleansia-table
        [data]="facade.disputes()"
        [columns]="disputeColumns"
        [actions]="disputeActions"
        [config]="{
          paginator: true,
          rows: 20,
          lazy: true,
          totalRecords: facade.totalRecords(),
          emptyMessage: 'pages.disputes_management.no_disputes',
          hover: true
        }"
        [loading]="facade.loading()"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
      >
      </cleansia-table>
      }
    </cleansia-section>
  </div>
</div>

<ng-template #statusTemplate let-item>
  <cleansia-status-badge kind="dispute" [value]="item.status" />
</ng-template>

<ng-template #reasonTemplate let-item>
  <span>{{ getReasonLabel(item) }}</span>
</ng-template>
