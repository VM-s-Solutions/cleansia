<form [formGroup]="form" (ngSubmit)="onApprove()" class="dialog-body">
  @if (data.subtitle) {
  <p class="dialog-lede">{{ data.subtitle }}</p>
  }

  <div class="form-grid">
    <div class="form-field form-field--full">
      <cleansia-select
        [options]="data.countries"
        [label]="'pages.employee_detail.approve_employee_dialog.work_country_label' | translate"
        [filter]="true"
        formControlName="workCountryId"
      />
    </div>
    <p class="form-hint">
      {{ 'pages.employee_detail.approve_employee_dialog.work_country_hint' | translate }}
    </p>

    <div class="form-field form-field--full">
      <cleansia-textarea
        formControlName="notes"
        [rows]="3"
        [label]="'pages.employee_detail.approve_employee_dialog.notes_label' | translate"
        [placeholder]="'pages.employee_detail.approve_employee_dialog.notes_placeholder' | translate"
      />
    </div>
    <p class="form-hint">
      {{ 'pages.employee_detail.approve_employee_dialog.notes_hint' | translate }}
    </p>
  </div>

  <div class="dialog-actions">
    <cleansia-button
      buttonType="button"
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      [disabled]="loading()"
      (onClick)="onCancel()"
    />
    <cleansia-button
      buttonType="submit"
      [label]="'pages.employee_detail.approve_employee_dialog.approve_button' | translate"
      icon="pi pi-check"
      [disabled]="form.invalid || loading()"
      [loading]="loading()"
    />
  </div>
</form>
