<form [formGroup]="form" (ngSubmit)="onReject()" class="dialog-body">
  @if (data.subtitle) {
  <p class="dialog-lede">{{ data.subtitle }}</p>
  }

  <div class="form-grid">
    <div class="form-field form-field--full">
      <cleansia-textarea
        formControlName="reason"
        [rows]="4"
        [label]="data.reasonLabel || ('pages.employee_management.reject_dialog.reason_label' | translate)"
        [placeholder]="data.reasonPlaceholder || ('pages.employee_management.reject_dialog.reason_placeholder' | translate)"
      />
    </div>
    <p class="form-hint">
      {{ 'pages.employee_management.reject_dialog.reason_hint' | translate }}
    </p>
  </div>

  <div class="dialog-actions">
    <cleansia-button
      buttonType="button"
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      [disabled]="loading()"
      (onClick)="onCancel()"
    />
    <cleansia-button
      buttonType="submit"
      [label]="data.submitLabel || ('pages.employee_management.reject_dialog.reject_button' | translate)"
      icon="pi pi-times"
      severity="danger"
      [outlined]="true"
      [disabled]="form.invalid || loading()"
      [loading]="loading()"
    />
  </div>
</form>
