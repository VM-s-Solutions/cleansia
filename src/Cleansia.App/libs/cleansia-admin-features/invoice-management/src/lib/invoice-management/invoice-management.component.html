<div class="cleansia-invoice-management cleansia-page">
  <div class="cleansia-invoice-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.invoice_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.invoice_management.description' | translate }}
        </p>
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-filter-drawer [state]="facade.filters">
          <form [formGroup]="facade.filterForm" class="filter-form">
            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.invoice_management.filters.status' | translate }}
              </h3>
              <div class="filter-checkbox-group">
                @for (option of facade.invoiceStatusOptions(); track option.value) {
                <div
                  class="filter-checkbox-item"
                  [class.checked]="facade.isStatusChecked(option.value)"
                  tabindex="0"
                  (click)="toggleStatus(option.value)"
                  (keydown.enter)="toggleStatus(option.value)"
                >
                  <cleansia-checkbox
                    [label]="option.label"
                    [ngModel]="facade.isStatusChecked(option.value)"
                    [ngModelOptions]="{ standalone: true }"
                    (valueChanges)="facade.setStatus(option.value, $event)"
                  />
                </div>
                }
              </div>
            </div>

            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.invoice_management.filters.currency' | translate }}
              </h3>
              <cleansia-select
                [options]="currencyOptions()"
                [label]="'pages.invoice_management.filters.currency' | translate"
                [showClear]="true"
                [showErrors]="false"
                formControlName="currencyId"
                appendTo="body"
              />
            </div>
          </form>
        </cleansia-filter-drawer>
      </div>
    </div>

    <cleansia-filter-chips [state]="facade.filters" />

    <cleansia-section>
      @if (facade.initialLoading()) {
      <cleansia-loader />
      } @else {
      <cleansia-table
        [data]="facade.invoices()"
        [columns]="table().columns"
        [actions]="table().actions"
        [config]="{
          paginator: true,
          rows: 20,
          lazy: true,
          totalRecords: facade.totalRecords(),
          hover: true,
          emptyMessage: 'pages.invoice_management.no_invoices'
        }"
        [loading]="facade.loading()"
        (pageChange)="facade.onPageChange($event)"
        (sortChange)="facade.onSortChange($event)"
      />
      }
    </cleansia-section>
  </div>
</div>

<ng-template #statusTemplate let-item>
  <div class="status-cell">
    <cleansia-status-badge kind="invoice" [value]="item.status" />
  </div>
</ng-template>

<ng-template #pdfStatusTemplate let-item>
  <div class="status-cell">
    <cleansia-status-badge kind="invoicePdf" [value]="getPdfState(item)" />
  </div>
</ng-template>
