<div class="cleansia-language-form cleansia-page">
  <div class="cleansia-language-form__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <div class="cleansia-detail-title">
          <cleansia-button
            [label]="'global.actions.back' | translate"
            icon="pi pi-arrow-left"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <cleansia-title [title]="pageTitle()" [level]="1" />
        </div>
      </div>
    </div>

    @if (facade.loading()) {
    <cleansia-loader />
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSave()" class="cleansia-form">
      <cleansia-section [title]="'pages.language_form.basic_info' | translate">
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.language_form.code' | translate"
              formControlName="code"
              [required]="true"
              [disabled]="isEditMode()"
            />
          </div>

          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.language_form.name' | translate"
              formControlName="name"
              [required]="true"
            />
          </div>
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          [label]="'global.actions.cancel' | translate"
          [outlined]="true"
          (onClick)="onCancel()"
        />
        <cleansia-button
          [label]="
            isEditMode()
              ? ('global.actions.save' | translate)
              : ('global.actions.create' | translate)
          "
          type="submit"
          [disabled]="facade.saving()"
          [loading]="facade.saving()"
          (onClick)="onSave()"
        />
      </div>
    </form>
    }
  </div>
</div>
