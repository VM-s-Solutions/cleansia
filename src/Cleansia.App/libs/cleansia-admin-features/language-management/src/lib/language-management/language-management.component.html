<div class="cleansia-language-management cleansia-page">
  <div class="cleansia-language-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.language_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.language_management.description' | translate }}
        </p>
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-filter-drawer [state]="facade.filters">
          <form [formGroup]="facade.filterForm" class="filter-form">
            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.language_management.filters.search' | translate }}
              </h3>
              <cleansia-text-input
                formControlName="searchTerm"
                [label]="'pages.language_management.filters.search_placeholder' | translate"
                [showErrors]="false"
              />
            </div>
          </form>
        </cleansia-filter-drawer>
        <cleansia-button
          *cleansiaPermission="Policy.CanCreateLanguage"
          [label]="'pages.language_management.create_language' | translate"
          icon="pi pi-plus"
          (onClick)="facade.navigateToCreateLanguage()"
        />
      </div>
    </div>

    <cleansia-filter-chips [state]="facade.filters" />

    <cleansia-section>
      @if (facade.initialLoading()) {
      <cleansia-loader />
      } @else {
      <cleansia-table
        [data]="facade.languages()"
        [columns]="table().columns"
        [actions]="table().actions"
        [config]="{
          paginator: true,
          rows: 20,
          emptyMessage: 'pages.language_management.no_languages'
        }"
        [loading]="facade.loading()"
      >
      </cleansia-table>
      }
    </cleansia-section>
  </div>
</div>

<p-confirmDialog />

<ng-template #flagTemplate let-item>
  <span
    [ngClass]="['fi', 'fi-' + getLanguageToCountryCode(item.code), 'flag-icon']"
  ></span>
</ng-template>
