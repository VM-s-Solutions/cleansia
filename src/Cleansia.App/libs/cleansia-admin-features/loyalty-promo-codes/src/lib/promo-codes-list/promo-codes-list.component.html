<div class="cleansia-promo-codes-list cleansia-page">
  <div class="cleansia-promo-codes-list__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.promo_codes.title' | translate" [level]="1" />
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-filter-drawer [state]="facade.filters">
          <form [formGroup]="facade.filterForm" class="filter-form">
            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.promo_codes.filters.search' | translate }}
              </h3>
              <cleansia-text-input
                formControlName="searchCode"
                [label]="'pages.promo_codes.search_placeholder' | translate"
                [showErrors]="false"
              />
            </div>

            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.promo_codes.filters.status' | translate }}
              </h3>
              <cleansia-select
                formControlName="status"
                [options]="facade.statusFilterOptions()"
                [showClear]="false"
                [showErrors]="false"
              />
            </div>
          </form>
        </cleansia-filter-drawer>
        <cleansia-button
          *cleansiaPermission="Policy.CanCreatePromoCode"
          [label]="'pages.promo_codes.new_button' | translate"
          icon="pi pi-plus"
          (onClick)="facade.navigateToCreate()"
        />
      </div>
    </div>

    <cleansia-filter-chips [state]="facade.filters" />

    <cleansia-section>
      @if (facade.initialLoading()) {
        <cleansia-loader />
      } @else {
        <cleansia-table
          [data]="facade.promoCodes()"
          [columns]="table().columns"
          [actions]="table().actions"
          [config]="{
            paginator: true,
            rows: 20,
            lazy: true,
            totalRecords: facade.totalRecords(),
            emptyMessage: 'pages.promo_codes.empty_list'
          }"
          [loading]="facade.loading()"
          (pageChange)="onPageChange($event)"
        />
      }
    </cleansia-section>
  </div>
</div>

<ng-template #statusTemplate let-item>
  <cleansia-status-badge kind="promo" [value]="promoStatus(item)" />
</ng-template>
