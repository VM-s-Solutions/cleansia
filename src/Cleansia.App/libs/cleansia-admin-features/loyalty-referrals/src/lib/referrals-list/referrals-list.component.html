<div class="cleansia-referrals-list cleansia-page">
  <div class="cleansia-referrals-list__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.loyalty_referrals.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.loyalty_referrals.description' | translate }}
        </p>
      </div>
      <div class="cleansia-page-header__actions">
        <cleansia-filter-drawer [state]="facade.filters">
          <form [formGroup]="facade.filterForm" class="filter-form">
            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.loyalty_referrals.filter.status' | translate }}
              </h3>
              <cleansia-select
                formControlName="status"
                [options]="facade.statusFilterOptions()"
                [showClear]="false"
                [showErrors]="false"
              />
            </div>

            <div class="filter-section">
              <h3 class="filter-section-title">
                {{ 'pages.loyalty_referrals.filter.date_range' | translate }}
              </h3>
              <div class="filter-date-range">
                <cleansia-calendar
                  formControlName="dateFrom"
                  [label]="'pages.loyalty_referrals.filter.date_from' | translate"
                  [showIcon]="true"
                  [showErrors]="false"
                  appendTo="body"
                />
                <cleansia-calendar
                  formControlName="dateTo"
                  [label]="'pages.loyalty_referrals.filter.date_to' | translate"
                  [showIcon]="true"
                  [showErrors]="false"
                  appendTo="body"
                />
              </div>
            </div>
          </form>
        </cleansia-filter-drawer>
      </div>
    </div>

    <cleansia-filter-chips [state]="facade.filters" />

    <cleansia-section>
      @if (facade.initialLoading()) {
        <cleansia-loader />
      } @else {
        <cleansia-table
          [data]="facade.referrals()"
          [columns]="table().columns"
          [actions]="table().actions"
          [config]="{
            paginator: true,
            rows: 20,
            lazy: true,
            totalRecords: facade.totalRecords(),
            emptyMessage: 'pages.loyalty_referrals.empty'
          }"
          [loading]="facade.loading()"
          (pageChange)="onPageChange($event)"
        />
      }
    </cleansia-section>
  </div>
</div>

<cleansia-admin-referral-intervention-dialog
  [visible]="dialogVisible()"
  (visibleChange)="onDialogVisibleChange($event)"
  [mode]="dialogMode()"
  [submitting]="facade.intervening()"
  (submitForm)="onInterventionSubmit($event)"
/>

<ng-template #statusTemplate let-row>
  <cleansia-status-badge kind="referral" [value]="row.status" />
</ng-template>

<ng-template #pointsTemplate let-row>
  {{ formatPointsAwarded(row) }}
</ng-template>
