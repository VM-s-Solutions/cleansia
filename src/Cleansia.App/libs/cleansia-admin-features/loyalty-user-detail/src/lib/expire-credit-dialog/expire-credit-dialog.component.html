<p-dialog
  [header]="'pages.loyalty_user_detail.credit.expire_dialog.title' | translate"
  [visible]="visible()"
  (visibleChange)="onVisibilityChanged($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="cleansia-dialog dialog-panel"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-body">
    <!--
      The amount is stated before the form, not implied by it: this takes the WHOLE balance and
      there is no undo. An admin who thought they were trimming it should read the number here.
    -->
    <p class="dialog-lede">
      {{
        'pages.loyalty_user_detail.credit.expire_dialog.lede'
          | translate: { amount: balanceLabel() }
      }}
    </p>

    <div class="form-grid">
      <div class="form-field form-field--full">
        <cleansia-textarea
          [label]="'pages.loyalty_user_detail.credit.expire_dialog.field.note' | translate"
          formControlName="note"
          [rows]="4"
        />
      </div>
      <p class="form-hint">
        {{ 'pages.loyalty_user_detail.credit.expire_dialog.field.note_help' | translate }}
      </p>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <cleansia-button
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    />
    <cleansia-button
      [label]="'pages.loyalty_user_detail.credit.expire_dialog.submit' | translate"
      icon="pi pi-times-circle"
      severity="danger"
      [outlined]="true"
      [disabled]="submitting()"
      [loading]="submitting()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
