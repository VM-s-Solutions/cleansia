<p-dialog
  [header]="headerKey() | translate"
  [visible]="visible()"
  (visibleChange)="onVisibilityChanged($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="cleansia-dialog dialog-panel"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-body">
    <div class="form-grid">
      <div class="form-field form-field--full">
        <cleansia-text-input
          [label]="'pages.loyalty_user_detail.grant_dialog.field.points' | translate"
          formControlName="points"
          dataType="number"
          [required]="true"
        />
      </div>

      <div class="form-field form-field--full">
        <cleansia-textarea
          [label]="'pages.loyalty_user_detail.grant_dialog.field.reason' | translate"
          formControlName="reason"
          [rows]="4"
        />
      </div>
      <p class="form-hint">
        {{ 'pages.loyalty_user_detail.grant_dialog.field.reason_help' | translate }}
      </p>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <cleansia-button
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    />
    <cleansia-button
      [label]="submitKey() | translate"
      icon="pi pi-check"
      [severity]="destructive() ? 'danger' : 'primary'"
      [outlined]="destructive()"
      [disabled]="submitting()"
      [loading]="submitting()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
