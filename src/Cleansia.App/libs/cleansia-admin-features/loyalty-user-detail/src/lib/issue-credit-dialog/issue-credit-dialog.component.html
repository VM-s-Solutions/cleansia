<p-dialog
  [header]="'pages.loyalty_user_detail.credit.dialog.title' | translate"
  [visible]="visible()"
  (visibleChange)="onVisibilityChanged($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="cleansia-dialog dialog-panel"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-body">
    <!--
      Said before the form, not after it: this is money the company owes from the moment the button
      is pressed, and it cannot be taken back from here.
    -->
    <p class="dialog-lede">
      {{ 'pages.loyalty_user_detail.credit.dialog.lede' | translate }}
    </p>

    <div class="form-grid">
      <div class="form-field form-field--full">
        <cleansia-select
          [label]="'pages.loyalty_user_detail.credit.dialog.field.currency' | translate"
          formControlName="currencyId"
          [options]="currencyOptions()"
          [showClear]="false"
          [required]="true"
        />
      </div>

      <div class="form-field form-field--full">
        <cleansia-text-input
          [label]="'pages.loyalty_user_detail.credit.dialog.field.amount' | translate"
          formControlName="amount"
          dataType="number"
          [required]="true"
        />
      </div>

      <div class="form-field form-field--full">
        <cleansia-select
          [label]="'pages.loyalty_user_detail.credit.dialog.field.reason' | translate"
          formControlName="reason"
          [options]="reasonOptions()"
          [showClear]="false"
        />
      </div>

      <div class="form-field form-field--full">
        <cleansia-textarea
          [label]="'pages.loyalty_user_detail.credit.dialog.field.note' | translate"
          formControlName="note"
          [rows]="4"
        />
      </div>
      <p class="form-hint">
        {{ 'pages.loyalty_user_detail.credit.dialog.field.note_help' | translate }}
      </p>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <cleansia-button
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    />
    <cleansia-button
      [label]="'pages.loyalty_user_detail.credit.dialog.submit' | translate"
      icon="pi pi-check"
      [disabled]="submitting()"
      [loading]="submitting()"
      (onClick)="submit()"
    />
  </ng-template>
</p-dialog>
