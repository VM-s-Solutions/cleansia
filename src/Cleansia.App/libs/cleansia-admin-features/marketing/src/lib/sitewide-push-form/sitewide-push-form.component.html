<div class="cleansia-sitewide-push cleansia-page">
  <div class="cleansia-sitewide-push__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.sitewide_push.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.sitewide_push.subtitle' | translate }}
        </p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="cleansia-form">
      <cleansia-section [title]="'pages.sitewide_push.titles_section' | translate">
        <div class="form-grid">
          @for (locale of ['En', 'Cs', 'Sk', 'Uk', 'Ru']; track locale) {
            <div class="form-field form-field--third">
              <cleansia-text-input
                [label]="'pages.sitewide_push.locale.' + locale.toLowerCase() + '_title' | translate"
                [formControlName]="'title' + locale"
                [required]="true"
              />
            </div>
          }
        </div>
      </cleansia-section>

      <cleansia-section [title]="'pages.sitewide_push.bodies_section' | translate">
        <div class="form-grid">
          @for (locale of ['En', 'Cs', 'Sk', 'Uk', 'Ru']; track locale) {
            <div class="form-field form-field--third">
              <cleansia-textarea
                [label]="'pages.sitewide_push.locale.' + locale.toLowerCase() + '_body' | translate"
                [formControlName]="'body' + locale"
                [required]="true"
                [rows]="3"
              />
            </div>
          }
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          type="submit"
          [label]="'pages.sitewide_push.send' | translate"
          icon="pi pi-send"
          [loading]="submitting()"
          [disabled]="submitting()"
        />
      </div>
    </form>
  </div>
</div>
