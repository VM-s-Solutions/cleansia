<div class="cleansia-pay-config-form cleansia-page">
  <div class="cleansia-pay-config-form__container page-wrapper page-wrapper--narrow">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <div class="cleansia-detail-title">
          <cleansia-button
            [label]="'global.actions.back' | translate"
            icon="pi pi-arrow-left"
            severity="secondary"
            [outlined]="true"
            (onClick)="onCancel()"
          />
          <cleansia-title [title]="pageTitle()" [level]="1" />
        </div>
      </div>
      @if (isEditMode()) {
      <div class="cleansia-page-header__actions">
        <cleansia-button
          *cleansiaPermission="Policy.CanViewAuditLog"
          class="cleansia-pay-config-form__audit-link"
          icon="pi pi-history"
          severity="secondary"
          [outlined]="true"
          [label]="'pages.audit_log.drill_in.view_history' | translate"
          (onClick)="viewAuditHistory()"
        />
      </div>
      }
    </div>

    @if (facade.loading()) {
    <cleansia-loader />
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSave()" class="cleansia-form">
      @if (!isEditMode()) {
      <cleansia-section
        [title]="'pages.pay_config_form.target' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--third">
            <cleansia-select
              [options]="serviceOptions()"
              [label]="'pages.pay_config_form.service' | translate"
              [floatVariant]="'on'"
              [filter]="true"
              formControlName="serviceId"
            />
          </div>
          <div class="form-field form-field--third">
            <cleansia-select
              [options]="packageOptions()"
              [label]="'pages.pay_config_form.package' | translate"
              [floatVariant]="'on'"
              [filter]="true"
              formControlName="packageId"
            />
          </div>
          <div class="form-field form-field--third">
            <cleansia-select
              [options]="currencyOptions()"
              [label]="'pages.pay_config_form.currency' | translate"
              [floatVariant]="'on'"
              [showClear]="false"
              formControlName="currencyId"
            />
          </div>
          <p class="form-hint">
            {{ 'pages.pay_config_form.target_hint' | translate }}
          </p>
        </div>
      </cleansia-section>
      }

      <cleansia-section
        [title]="'pages.pay_config_form.pay_rates' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.pay_config_form.base_pay' | translate"
              formControlName="basePay"
              dataType="number"
              [required]="true"
            />
          </div>
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.pay_config_form.extra_per_room' | translate"
              formControlName="extraPerRoom"
              dataType="number"
            />
          </div>
          <div class="form-field form-field--third">
            <cleansia-text-input
              [label]="'pages.pay_config_form.extra_per_bathroom' | translate"
              formControlName="extraPerBathroom"
              dataType="number"
            />
          </div>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.pay_config_form.pay_limits' | translate"
      >
        <div class="form-grid">
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.pay_config_form.minimum_pay' | translate"
              formControlName="minimumPay"
              dataType="number"
            />
          </div>
          <div class="form-field">
            <cleansia-text-input
              [label]="'pages.pay_config_form.maximum_pay' | translate"
              formControlName="maximumPay"
              dataType="number"
            />
          </div>
          <p class="form-hint">
            {{ 'pages.pay_config_form.pay_limits_hint' | translate }}
          </p>
        </div>
      </cleansia-section>

      <cleansia-section
        [title]="'pages.pay_config_form.description_section' | translate"
      >
        <div class="form-grid">
          <div class="form-field form-field--full">
            <cleansia-textarea
              [label]="'pages.pay_config_form.description' | translate"
              formControlName="description"
              [rows]="3"
            />
          </div>
        </div>
      </cleansia-section>

      <div class="form-actions">
        <cleansia-button
          [label]="'global.actions.cancel' | translate"
          [outlined]="true"
          (onClick)="onCancel()"
        />
        <cleansia-button
          [label]="
            isEditMode()
              ? ('global.actions.save' | translate)
              : ('global.actions.create' | translate)
          "
          type="submit"
          [disabled]="facade.saving()"
          [loading]="facade.saving()"
          (onClick)="onSave()"
        />
      </div>
    </form>
    }
  </div>
</div>
