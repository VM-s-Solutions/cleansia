@if (isClosed()) {
<cleansia-button
  [label]="'pay_periods.detail.ops.mark_paid.action' | translate"
  icon="pi pi-money-bill"
  [outlined]="facade.activePanel() !== 'markPaid'"
  (onClick)="togglePanel('markPaid')"
/>

@if (facade.activePanel() === 'markPaid') {
<div class="detail-actions__panel">
  <p class="detail-actions__hint">
    {{ 'pay_periods.detail.ops.mark_paid.hint' | translate }}
  </p>
  @if (facade.errorKey()) {
  <p class="detail-actions__error">{{ facade.errorKey()! | translate }}</p>
  }
  <cleansia-button
    [label]="'pay_periods.detail.ops.mark_paid.submit' | translate"
    icon="pi pi-money-bill"
    [loading]="facade.submitting()"
    (onClick)="submitMarkPaid()"
  />
</div>
}
}
