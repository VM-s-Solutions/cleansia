<div class="cleansia-template-management cleansia-page">
  <div class="cleansia-template-management__container page-wrapper">
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.template_management.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.template_management.description' | translate }}
        </p>
      </div>
    </div>

    @if (tabs.length > 1) {
    <div class="cleansia-template-management__tabs">
      <p-tabs [value]="activeTabIndex()" (valueChange)="onTabChange($event)">
        <p-tablist>
          @for (tab of tabs; track tab.route; let i = $index) {
          <p-tab [value]="i">
            <i [class]="tab.icon"></i>
            <span>{{ tab.label }}</span>
          </p-tab>
          }
        </p-tablist>
      </p-tabs>
    </div>
    }

    <div class="cleansia-template-management__content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
