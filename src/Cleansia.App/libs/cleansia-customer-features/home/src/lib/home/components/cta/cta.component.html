<section class="cl-cta" id="cta">
  <cleansia-foam-edge class="cl-foam" variant="hood-short" [fill]="'var(--cl-foam)'" />

  <div class="cl-cta__inner">
    <div class="cl-cta__card cl-lift animate-on-scroll">
      <div class="cl-cta__row cl-cta__row--claim">
        <img
          class="cl-cta__mascot"
          src="assets/images/mascot/mascot-waving.webp"
          alt=""
          width="300"
          height="300"
          loading="lazy"
        />
        <div class="cl-cta__copy">
          <h2 class="cl-d2 cl-cta__title">{{ 'pages.home.cta.title' | translate }}</h2>
          <p class="cl-body cl-cta__desc">{{ 'pages.home.cta.desc' | translate }}</p>
        </div>
        <div class="cl-cta__actions">
          <a class="cl-btn" routerLink="/order">{{ 'pages.home.cta.button' | translate }}</a>
          <a class="cl-link" routerLink="/services">{{ 'pages.home.cta.secondary' | translate }}</a>
        </div>
      </div>
    </div>
  </div>
</section>
