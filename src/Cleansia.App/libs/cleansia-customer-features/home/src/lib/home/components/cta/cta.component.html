<section class="cl-cta" id="cta">
  <div class="cl-cta__inner">
    <cleansia-title
      [title]="'pages.home.cta.title'"
      size="big"
      [level]="2"
      className="cl-cta__title"
    />
    <p class="cl-cta__desc">{{ 'pages.home.cta.desc' | translate }}</p>
    <cleansia-button
      routerLink="/order"
      appearance="brand"
      buttonSize="large"
      [label]="'pages.home.cta.button' | translate"
    />
  </div>
</section>
