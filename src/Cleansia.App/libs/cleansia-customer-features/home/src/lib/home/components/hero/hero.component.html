<section class="cl-hero" id="hero">
  <div class="cl-hero__sud cl-hero__sud--1" aria-hidden="true"></div>
  <div class="cl-hero__sud cl-hero__sud--2" aria-hidden="true"></div>
  <div class="cl-hero__sud cl-hero__sud--3" aria-hidden="true"></div>
  <div class="cl-hero__inner">
    <div class="cl-hero__text animate-on-scroll">
      <h1 class="cl-d1 cl-hero__title">{{ 'pages.home.hero.title' | translate }}</h1>
      <p class="cl-hero__subtitle">
        {{ 'pages.home.hero.subtitle' | translate }}
      </p>
      <div class="cl-hero__buttons">
        <a class="cl-btn" routerLink="/order">{{ 'pages.home.hero.book_now' | translate }}</a>
        <a class="cl-link" routerLink="/services">{{ 'pages.home.hero.view_services' | translate }}</a>
      </div>

      <div class="cl-hero__spacer"></div>

      <div class="cl-hero__image animate-on-scroll delay-1">
        <img
          src="assets/images/mascot/mascot-mopping.webp"
          srcset="assets/images/mascot/mascot-mopping-480.webp 480w, assets/images/mascot/mascot-mopping.webp 800w"
          sizes="(max-width: 768px) 260px, 400px"
          alt="Cleaning mascot"
          width="800"
          height="800"
          loading="eager"
          fetchpriority="high"
        />
      </div>
    </div>
    <cleansia-quick-quote [services]="quoteServices()" />
  </div>
  <cleansia-foam-edge class="cl-foam cl-foam--hero" variant="cap-short" />
</section>
