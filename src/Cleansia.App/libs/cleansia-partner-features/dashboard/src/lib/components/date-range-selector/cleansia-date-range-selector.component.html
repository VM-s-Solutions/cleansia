<div class="cleansia-date-range-selector">
  <div class="cleansia-date-range-selector__buttons" role="group">
    @for (option of presets; track option.preset) {
    <cleansia-button
      [label]="option.labelKey | translate"
      [buttonSize]="'small'"
      [outlined]="selectedPreset() !== option.preset"
      (onClick)="selectPreset(option.preset)"
    />
    }
  </div>

  <div class="cleansia-date-range-selector__display">
    <i class="pi pi-calendar"></i>
    <cleansia-label [text]="rangeLabel()" size="sm" color="secondary" />
  </div>
</div>
