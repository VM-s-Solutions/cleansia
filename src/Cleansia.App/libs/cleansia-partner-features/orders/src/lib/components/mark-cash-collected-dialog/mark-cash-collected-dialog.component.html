<div class="dialog-body">
  @if (hasAmount) {
  <p class="dialog-lede">
    {{ 'pages.order_details.mark_cash_collected_confirm_message' | translate: { amount: data.amount } }}
  </p>
  } @else {
  <p class="dialog-lede">
    {{ 'pages.order_details.mark_cash_collected_confirm_message_no_amount' | translate }}
  </p>
  }

  <div class="dialog-summary">
    <p class="dialog-summary__title">
      {{ 'pages.order_details.mark_cash_collected_confirm_warning' | translate }}
    </p>
  </div>

  <div class="dialog-actions">
    <cleansia-button
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="onCancel()"
    />
    <cleansia-button
      [label]="'pages.order_details.mark_cash_collected_confirm_action' | translate"
      icon="pi pi-check"
      (onClick)="onConfirm()"
    />
  </div>
</div>
