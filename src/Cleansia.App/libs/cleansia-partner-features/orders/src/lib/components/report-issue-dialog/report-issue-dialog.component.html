<form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-body">
  <div class="form-grid">
    <div class="form-field form-field--full">
      <cleansia-textarea
        formControlName="description"
        [label]="'pages.order_details.issue_description' | translate"
        [placeholder]="'pages.order_details.issue_description_placeholder' | translate"
        [rows]="5"
      />
    </div>
  </div>

  <div class="dialog-actions">
    <cleansia-button
      buttonType="button"
      [label]="'global.actions.cancel' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="onCancel()"
    />
    <cleansia-button
      buttonType="submit"
      [label]="'pages.order_details.report_issue' | translate"
      icon="pi pi-send"
      [disabled]="form.invalid"
    />
  </div>
</form>
