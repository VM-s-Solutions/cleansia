@if (labels().length > 0) {
<cleansia-section [title]="'pages.order_details.extras' | translate">
  <div class="cleansia-order-details__extras-list">
    @for (extra of labels(); track extra.slug) {
    <div class="extra-item">
      <i class="pi pi-check-circle"></i>
      <span>{{ extra.label }}</span>
    </div>
    }
  </div>
</cleansia-section>
}
