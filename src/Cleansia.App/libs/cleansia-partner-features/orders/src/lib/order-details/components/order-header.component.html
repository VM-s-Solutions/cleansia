<div class="cleansia-order-details__status-banner">
  <div class="order-header-top">
    <span class="order-header-number">{{ orderNumber() }}</span>
    <div class="order-header-badges">
      <cleansia-status-badge kind="order" [value]="orderStatus()" />
      <cleansia-status-badge kind="payment" [value]="paymentStatus()" />
    </div>
  </div>
  <div class="order-header-meta">
    <span class="order-header-meta__item">
      <i class="pi pi-calendar"></i>
      {{ createdOn() }}
    </span>
  </div>
  <div class="order-header-actions">
    <cleansia-button
      [label]="'pages.order_details.print' | translate"
      [icon]="'pi pi-print'"
      [severity]="'secondary'"
      [outlined]="true"
      [buttonSize]="'small'"
      (onClick)="print.emit()"
    />
    @if (hasInvoice()) {
    <cleansia-button
      [label]="'pages.order_details.download_invoice' | translate"
      [icon]="'pi pi-download'"
      [severity]="'secondary'"
      [outlined]="true"
      [buttonSize]="'small'"
      (onClick)="downloadInvoice.emit()"
    />
    }
  </div>
</div>
