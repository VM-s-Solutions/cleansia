@if (facade.profileLoading()) {
<div class="cleansia-profile cleansia-page">
  <div class="cleansia-profile__form-card page-wrapper page-wrapper--narrow">
    <cleansia-loader />
  </div>
</div>
} @else {
<div class="cleansia-profile cleansia-page">
  <form
    class="cleansia-profile__form-card page-wrapper page-wrapper--narrow"
    [formGroup]="facade.formGroup"
  >
    <div class="cleansia-page-header">
      <div class="cleansia-page-header__heading">
        <cleansia-title [title]="'pages.profile.title' | translate" [level]="1" />
        <p class="cleansia-page-header__description">
          {{ 'pages.profile.description' | translate }}
        </p>
      </div>
    </div>

    <!-- Personal Information Section -->
    <cleansia-partner-profile-personal-info [facade]="facade" />

    <!-- Emergency Contact Section -->
    <cleansia-partner-profile-emergency-contact [facade]="facade" />

    <!-- Employee Documents Management Section -->
    <cleansia-partner-profile-documents [facade]="facade.documentsFacade" />


    <!-- Job alert distance — its own endpoint, so its own save -->
    <cleansia-partner-profile-job-radius
      [facade]="facade.jobRadiusFacade"
      (retry)="facade.refreshProfile()"
    />

    <!-- Bank Details Section — its own endpoint, so its own form and save -->
    <cleansia-partner-profile-bank [facade]="facade.bankFacade" />

    <!-- Consent Section -->
    <div class="cleansia-profile__consent">
      <cleansia-checkbox
        [title]="'pages.profile.consent' | translate"
        formControlName="consent"
        [required]="true"
        [showErrors]="false"
      />
      <span
        class="cleansia-profile__consent-text"
        [innerHtml]="'pages.profile.consent_text' | translate"
      ></span>
    </div>

    <div class="cleansia-profile__actions">
      <cleansia-button
        [severity]="'danger'"
        [outlined]="true"
        [icon]="'pi pi-sign-out'"
        [label]="'sidebar.logout' | translate"
        (onClick)="onLogout()"
        [disabled]="facade.profileSubmitLoading()"
      />
      <cleansia-button
        [buttonType]="'submit'"
        [label]="'pages.profile.submit' | translate"
        (onClick)="facade.onSubmit()"
        [loading]="facade.profileSubmitLoading()"
      />
    </div>
  </form>
</div>
}
