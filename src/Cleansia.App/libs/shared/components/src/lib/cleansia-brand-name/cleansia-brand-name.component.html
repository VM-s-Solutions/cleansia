<div
  class="cleansia-brand-name"
  [class.cleansia-brand-name--compact]="compact()"
>
  <a [routerLink]="'/' + defaultRoute()">
    <picture>
      <source srcset="assets/logos/Logo.webp" type="image/webp" />
      <img
        src="assets/logos/Logo.png"
        alt="Cleansia"
        width="132"
        height="24"
        loading="lazy"
        decoding="async"
      />
    </picture>
  </a>
</div>
