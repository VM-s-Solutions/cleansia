@if (isLink()) {
<!--
  One element that is both a link and a button. The alternative the pages used
  was a <button> nested inside an <a>, which is invalid HTML and announces two
  controls where there is one.
-->
@if (routerLink(); as link) {
<a
  #control
  pButton
  [class]="cssClasses()"
  [routerLink]="link"
  [queryParams]="queryParams()"
  [label]="label() || title()"
  [icon]="icon() ?? ''"
  [iconPos]="iconPosition()"
  [severity]="severity()"
  [raised]="style() === 'raised-button'"
  [outlined]="outlined()"
  [rounded]="rounded() || isIconOnly()"
  [text]="text()"
  [pTooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  (click)="handleClick($event)"
></a>
} @else {
<a
  #control
  pButton
  [class]="cssClasses()"
  [href]="href()"
  [label]="label() || title()"
  [icon]="icon() ?? ''"
  [iconPos]="iconPosition()"
  [severity]="severity()"
  [raised]="style() === 'raised-button'"
  [outlined]="outlined()"
  [rounded]="rounded() || isIconOnly()"
  [text]="text()"
  [pTooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  (click)="handleClick($event)"
></a>
} } @else {
<p-button
  #control
  [class]="cssClasses()"
  [label]="label() || title()"
  [icon]="icon()"
  [iconPos]="iconPosition()"
  [loading]="loading()"
  [disabled]="disabled()"
  [severity]="severity()"
  [raised]="style() === 'raised-button'"
  [outlined]="outlined()"
  [rounded]="rounded() || isIconOnly()"
  [text]="text()"
  [type]="buttonType()"
  [pTooltip]="tooltip()"
  [tooltipPosition]="tooltipPosition()"
  [ariaLabel]="resolvedAriaLabel()"
  [pt]="disclosurePt()"
  (onClick)="handleClick($event)"
/>
}
