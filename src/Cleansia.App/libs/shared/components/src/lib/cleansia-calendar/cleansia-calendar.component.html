@if (floatVariant(); as variant) {
<p-floatlabel [variant]="variant">
  <p-datepicker
    [inputId]="id()"
    [(ngModel)]="innerValue"
    (ngModelChange)="handleChange($event)"
    [showIcon]="showIcon()"
    [iconDisplay]="iconDisplay()"
    [dateFormat]="dateFormat()"
    [placeholder]="placeholder() ? placeholder() : ' '"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [appendTo]="appendTo()"
    [class]="'cleansia-calendar ' + (hasErrors() ? 'ng-invalid ng-dirty' : '')"
  />
  <label [for]="id()">{{ label() }}</label>
</p-floatlabel>
} @else {
<div class="cleansia-calendar-wrapper">
  <!--
    Label FIRST. It was written after the picker, which read correctly only
    while the surrounding CSS reversed the order for a floating label — with a
    stacked label the field's name ended up underneath the field.
  -->
  @if (label()) {
  <label [for]="id()" class="cleansia-calendar-label">
    {{ label() }}
    @if (required()) { <span class="required-asterisk">*</span> }
  </label>
  }
  <p-datepicker
    [inputId]="id()"
    [(ngModel)]="innerValue"
    (ngModelChange)="handleChange($event)"
    [showIcon]="showIcon()"
    [iconDisplay]="iconDisplay()"
    [dateFormat]="dateFormat()"
    [placeholder]="placeholder()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [appendTo]="appendTo()"
    [class]="'w-full ' + (hasErrors() ? 'ng-invalid ng-dirty' : '')"
  />
</div>
} @if (showErrors() && formControl.invalid && (formControl.dirty ||
formControl.touched)) {
<ul class="cleansia-error-message-container">
  @for (error of formControl.errors | error; track $index) {
  <li>{{ error }}</li>
  }
</ul>
}
