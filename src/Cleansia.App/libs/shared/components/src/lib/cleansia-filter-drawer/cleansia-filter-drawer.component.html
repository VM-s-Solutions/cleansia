<div class="cleansia-filter-drawer__trigger" #trigger>
  <cleansia-button
    [label]="title() || ('global.filters.title' | translate)"
    icon="pi pi-filter"
    [severity]="state().active() ? 'primary' : 'secondary'"
    [outlined]="!state().active()"
    (onClick)="state().open()"
  />
  @if (state().active()) {
  <span class="cleansia-filter-drawer__count">{{ state().count() }}</span>
  }
</div>

@if (state().isOpen()) {
<div class="cleansia-filter-drawer__backdrop" aria-hidden="true" (click)="state().close()"></div>
}

<div
  #panel
  class="cleansia-filter-drawer__panel"
  [class.cleansia-filter-drawer__panel--open]="state().isOpen()"
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  [attr.aria-label]="title() || ('global.filters.title' | translate)"
  [attr.inert]="state().isOpen() ? null : ''"
>
  <div class="cleansia-filter-drawer__header">
    <h2 class="cleansia-filter-drawer__title">
      <i class="pi pi-filter" aria-hidden="true"></i>
      {{ title() || ('global.filters.title' | translate) }}
    </h2>
    <cleansia-button
      class="cleansia-filter-drawer__close"
      icon="pi pi-times"
      severity="secondary"
      style="basic-button"
      [text]="true"
      [ariaLabel]="'global.close' | translate"
      (onClick)="state().close()"
    />
  </div>

  <div class="cleansia-filter-drawer__body">
    <ng-content></ng-content>
  </div>

  <div class="cleansia-filter-drawer__footer">
    <cleansia-button
      [label]="'global.filters.reset' | translate"
      icon="pi pi-refresh"
      severity="secondary"
      [outlined]="true"
      (onClick)="state().reset()"
    />
  </div>
</div>
