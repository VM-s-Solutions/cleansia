@switch (headingLevel()) { @case (1) {
<h1 class="cleansia-title--{{ size() }} {{ className() }}">
  {{ title() | translate }}
</h1>
} @case (2) {
<h2 class="cleansia-title--{{ size() }} {{ className() }}">
  {{ title() | translate }}
</h2>
} @case (5) {
<h5 class="cleansia-title--{{ size() }} {{ className() }}">
  {{ title() | translate }}
</h5>
} @default {
<h3 class="cleansia-title--{{ size() }} {{ className() }}">
  {{ title() | translate }}
</h3>
} }
