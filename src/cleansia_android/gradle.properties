# Unified gradle.properties for the cleansia_android_shared monorepo.
# 4g heap matches customer-app's settings — partner was on 2g but doubling
# is harmless and the customer-app side genuinely needs the extra memory
# under Hilt + KSP + OpenAPI generator.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

# KSP2 mode: customer-app shipped on it without issue, but partner-app's KSP run
# hits "unexpected jvm signature V" under KSP2 — most likely the Hilt 2.54
# compiler interaction with KSP2 + Java 21. Disabling globally for both apps
# is safer than per-app overrides; KSP1 is still the default for the Android
# Gradle plugin, so nothing breaks on the customer side.
ksp.useKSP2=false

# ─── Release version code ─────────────────────────────────────────────────
# ONE number for BOTH apps, and the only place it is written down. Bump it by
# 1 before EVERY upload attempt, including a build you end up discarding: Play
# spends a version code the moment it accepts an AAB and never returns it.
# The rest of the Play procedure → /mobile-app/overview#shipping-to-google-play
#
# Override a single build without editing this file:
#     ./gradlew :partner-app:bundleRelease -PVERSION_CODE=9
#
# Editing this line does nothing if VERSION_CODE is also set in
# ~/.gradle/gradle.properties or in the ORG_GRADLE_PROJECT_VERSION_CODE
# environment variable. Both silently outrank this file, without a warning.
VERSION_CODE=2
