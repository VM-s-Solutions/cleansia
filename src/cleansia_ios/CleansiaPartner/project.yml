name: CleansiaPartner

options:
  bundleIdPrefix: cz.cleansia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

knownRegions:
  - en
  - cs
  - sk
  - uk
  - ru

# DEVELOPMENT_TEAM is supplied by ../Config/Base.xcconfig, which includes the
# gitignored ../Config/Local.xcconfig shared with the customer app. Never put the value
# here: git destroys it on any pull or branch switch.
configFiles:
  Debug: ../Config/Base.xcconfig
  Release: ../Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Pins compile-time string extraction OFF so no build ever sync-rewrites the
    # hand-managed Localizable.xcstrings (stale-marking + junk auto-extracted keys).
    SWIFT_EMIT_LOC_STRINGS: NO

packages:
  CleansiaCore:
    path: ../CleansiaCore
  # Generated swift5 business client (machine-owned, gitignored). Regenerate via
  # scripts/generate-api-clients.sh after a mobile-spec refresh; never hand-edit.
  CleansiaPartnerApi:
    path: ../CleansiaPartnerApi
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  CleansiaPartner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
      - path: PrivacyInfo.xcprivacy
      # Owner-local, gitignored FCM config. The folder is committed (empty); the
      # owner drops GoogleService-Info.plist here. Absent → no-plist build still
      # compiles and simply runs without push (see GoogleServicePlist gate).
      - path: Firebase
        optional: true
        excludes:
          - ".gitkeep"
    info:
      path: Info.plist
      properties:
        # Version + build wired to the target's MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION build settings (xcodegen would otherwise bake
        # literal "1.0"/"1"), so a release bump is a single settings change and
        # fastlane can override CURRENT_PROJECT_VERSION per TestFlight upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS/Keychain only — exempt from export compliance, so every
        # TestFlight upload skips the encryption-usage question.
        ITSAppUsesNonExemptEncryption: false
        # Static launch screen — parity analogue of Android's system splash
        # background (Theme.Cleansia.Splash windowSplashScreenBackground, with
        # the values-night dark variant). Also opts the app into native
        # full-screen rendering (without it iOS letterboxes). Branded launch
        # storyboard (T-0426): full-bleed SplashBackground colour + the centered
        # "Cleansia PARTNER" wordmark (LaunchScreen.storyboard), Auto-Layout-
        # constrained so it avoids the old UIImageName scaling bug. The partner
        # in-app SplashGateView now shows the same letter-by-letter wordmark reveal.
        UILaunchStoryboardName: LaunchScreen
        # Home-screen app name — show "Cleansia Partner" rather than the PRODUCT_NAME ("CleansiaPartner").
        CFBundleDisplayName: Cleansia Partner
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # T-0403 debug: Firebase's app-delegate swizzling proxy is the only
        # foreign machinery between our registerForRemoteNotifications call and
        # UIKit, and the device syslog showed the registration generating ZERO
        # system traffic (no SpringBoard handling, no apsd token request). We
        # integrate Messaging manually anyway (we set Messaging.apnsToken in
        # didRegister..., own the MessagingDelegate + UNUserNotificationCenter
        # delegate, and pull the token explicitly), so the proxy is pure risk:
        # disable it per Firebase's own manual-integration guidance.
        FirebaseAppDelegateProxyEnabled: false
        API_BASE_URL: $(API_BASE_URL)
        NSCameraUsageDescription: Cleansia uses the camera to capture before and after photos of your cleaning jobs.
        NSPhotoLibraryUsageDescription: Cleansia needs access to your photos so you can attach before and after photos to your jobs.
        NSLocationWhenInUseUsageDescription: Cleansia uses your location to center the map when you set your address and to show on your job list how far each job is from you. The distance is calculated on your device only.
        UIAppFonts:
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Nunito-Regular.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
    entitlements:
      path: CleansiaPartner.entitlements
      properties:
        aps-environment: development
        # The Notification Service Extension reads the in-app language from here (AppGroupLanguage).
        com.apple.security.application-groups:
          - group.cz.cleansia.partner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cleansia.partner
        PRODUCT_NAME: CleansiaPartner
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        API_BASE_URL: https:/$()/api-cleansia-partner-mobile-weu-dev.azurewebsites.net
      configs:
        # The production custom domain, matching the Android release build. The TestFlight lanes
        # archive Release, so this is also the host a TestFlight upload calls by default (a lane's
        # api_base_url: overrides it for one build — fastlane/README.md). Owner step
        # before the first one: the CNAME + asuid TXT records (deploy/AZURE-DEV-RUNBOOK.md §12.1),
        # then an `api-partner-mobile` key in weu.prod.bicepparam's customDomains, which main.bicep
        # binds to the prod Partner Mobile host.
        Release:
          API_BASE_URL: https:/$()/api-partner-mobile.cleansia.cz
    preBuildScripts:
      - name: Verify local build configuration
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/../scripts/check-local-config.sh" DEVELOPMENT_TEAM'
    dependencies:
      - package: CleansiaCore
      - package: CleansiaPartnerApi
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      # Embeds the Notification Service Extension, which renders pushes in the in-app language.
      - target: CleansiaPartnerNotificationService

  CleansiaPartnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cleansia.partner.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CleansiaPartner
      - package: CleansiaCore

  # Re-renders every loc-key push in the language picked inside the app: iOS resolves loc-keys in the
  # app's SYSTEM language, and the server marks those alerts mutable-content so this runs for each.
  # It reads the language from the App Group and the copy from the app's own catalog, compiled into
  # it. It does not link CleansiaCore — its resource bundle would be copied in — and compiles the one
  # Foundation-only file it needs instead. -> /architecture/push-notifications
  CleansiaPartnerNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NotificationService
      - path: ../CleansiaCore/Sources/CleansiaCore/Localization/AppGroupLanguage.swift
      - path: Resources/Localizable.xcstrings
    info:
      path: NotificationService/Info.plist
      properties:
        # Must track the parent app exactly — Apple rejects an extension whose version differs.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Cleansia Partner
        CFBundleLocalizations:
          - en
          - cs
          - sk
          - uk
          - ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/CleansiaPartnerNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cz.cleansia.partner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cleansia.partner.notificationservice
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO

schemes:
  CleansiaPartner:
    build:
      targets:
        CleansiaPartner: all
        CleansiaPartnerTests: [test]
    test:
      targets:
        - CleansiaPartnerTests
      gatherCoverageData: false
